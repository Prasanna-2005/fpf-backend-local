[server]
port = 8080

[api]
version = v1

[cors]
enable  = true
origins =  ${ALLOWED_ORIGINS}
headers = accept,content-type,x-user-id,origin

[cookie_access_token]
path = "/"
domain = 
secure = false
http_only = true

[cookie_refresh_token]
path =  "api/v1/auth/"
domain = 
secure = false
http_only = true

[Relations]
SESSION_LOGS="session_logs"
USERS="users"

[storage]
upload_volume_path = data/
latest_changes_refresh_interval = 300s

[db_pool]
# Connections kept ready for the next request. The idle pool is the same size,
# so a request reuses a connection to the database VM instead of opening a new one.
max_open_conns = 50
# A new connection to the database host spends about 4.5s in the MySQL handshake.
# Keep a live connection for half an hour. Idle sockets are closed sooner, and a
# background ping keeps one connection ready for the next request.
conn_max_lifetime = 30m
conn_max_idle_time = 4m
ping_interval = 30s
ping_timeout = 8s
