[server]
port = 8080

[api]
version = v1

[cors]
enable  = true
origins =  ${ALLOWED_ORIGINS}
headers = accept,content-type,x-user-id,origin

[cookie_access_token]
path = "/"
domain = 
secure = false
http_only = true

[cookie_refresh_token]
path =  "api/v1/auth/"
domain = 
secure = false
http_only = true

[Relations]
SESSION_LOGS="session_logs"
USERS="users"

[storage]
upload_volume_path = data/
latest_changes_refresh_interval = 300s

[db_pool]
# Connections kept ready for the next request. The idle pool is the same size,
# so a request reuses a connection to the database VM instead of opening a new one.
max_open_conns = 50
# go-sql-driver/mysql v1.8.1 requires a max lifetime so the pool closes a connection
# before MySQL, the OS, or a firewall does. Its example is 3 minutes, under the
# 5 minutes at which some middlewares drop an idle connection:
# https://github.com/go-sql-driver/mysql/blob/v1.8.1/README.md#important-settings
conn_max_lifetime = 3m
