[server]
port = 8080

[api]
version = v1

[cors]
enable  = true
origins = http://localhost:5173
headers = accept,content-type,x-user-id   # <= lower-case tokens

[cookie_access_token]
path = "/"
domain = 
secure = false
http_only = true

[cookie_refresh_token]
path =  "api/v1/auth/"
domain = 
secure = false
http_only = true

[Relations]
SESSION_LOGS="session_logs"
USERS="users"

[storage]
upload_volume_path = ../data/